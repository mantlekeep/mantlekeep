name: security

# The permanent security gate. Every push and PR to main is scanned in ALL THREE languages before
# it can land: the Java surface with SpotBugs + FindSecBugs (security detectors), the Go engine with
# gosec, staticcheck, and govulncheck, and the Rust crates with clippy + cargo-audit. Any finding —
# or any known CVE — fails the job. This runs
# alongside ci.yml (the build/test gate); keeping security in its own workflow makes a red gate
# read as "unsafe to adopt", not "the build broke".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly re-scan on UNCHANGED code: a stdlib/dependency CVE disclosed after the last commit only
  # surfaces on a push otherwise. This makes "keep the framework CVE-clean" self-maintaining — a new
  # advisory reds this gate within the week, prompting a toolchain/dep bump even with no code change.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

env:
  # java-core binds the Rust ABI via java.lang.foreign (release 22) and the spring-boot family
  # targets a Java 25 toolchain — 25 satisfies both and is auto-detected for the toolchain.
  JAVA_VERSION: "25"
  # Pinned to the exact patched toolchain, not a floating "1.26.x": go1.26.6 clears the crypto/tls,
  # net/http and encoding/asn1 stdlib advisories (GO-2026-6090/6089/5972/5856) that govulncheck flags
  # on 1.26.4. Bump this in lockstep with mantlekeep-control/go.mod's `go` directive on the next CVE.
  GO_VERSION: "1.26.6"
  # Pinned so a toolchain bump is a reviewed commit, not a silent change in what clippy accepts —
  # a new stable can add lints that red this gate with no code change. Raise it deliberately.
  RUST_VERSION: "1.96.1"

jobs:
  java-security:
    name: java — spotbugs + findsecbugs (sdk + spring-boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # spotbugsMain fails the build on any SpotBugs/FindSecBugs finding that the justified
      # exclude filter (spotbugs-exclude.xml) does not cover — that is the gate.
      - name: sdk — spotbugs + findsecbugs
        run: ./gradlew spotbugsMain --no-daemon
        working-directory: sdks/java
      - name: spring-boot — spotbugs + findsecbugs
        run: ./gradlew spotbugsMain --no-daemon
        working-directory: mantlekeep-spring-boot

  go-security:
    name: go — gosec · staticcheck · govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantlekeep-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build pinned analysis tools
        env:
          # The tools module is intentionally OUTSIDE go.work: it exists to build
          # binaries and must never join the workspace the published modules share.
          GOWORK: "off"
        run: |
          go -C "$GITHUB_WORKSPACE/tools" build -o "$GITHUB_WORKSPACE/bin/" \
            honnef.co/go/tools/cmd/staticcheck \
            golang.org/x/vuln/cmd/govulncheck \
            github.com/securego/gosec/v2/cmd/gosec
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      # gosec — security-focused static analysis; exits non-zero on any finding.
      - name: gosec
        run: gosec ./...
      # staticcheck — correctness/lint that also catches unsafe patterns.
      - name: staticcheck
        run: staticcheck ./...
      # govulncheck — fails on any KNOWN CVE reachable from the code.
      - name: govulncheck
        run: govulncheck ./...

  go-kafka-security:
    name: go (kafka adapter) — gosec · staticcheck · govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantlekeep-kafka
    # The adapter modules are scanned SEPARATELY from the core, which is the whole point of
    # splitting them: the Kafka client tree is scanned here, and a CVE in it reds this job
    # without touching the engine's gate or its build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build pinned analysis tools
        env:
          # The tools module is intentionally OUTSIDE go.work: it exists to build
          # binaries and must never join the workspace the published modules share.
          GOWORK: "off"
        run: |
          go -C "$GITHUB_WORKSPACE/tools" build -o "$GITHUB_WORKSPACE/bin/" \
            honnef.co/go/tools/cmd/staticcheck \
            golang.org/x/vuln/cmd/govulncheck \
            github.com/securego/gosec/v2/cmd/gosec
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: gosec
        run: gosec ./...
      - name: staticcheck
        run: staticcheck ./...
      - name: govulncheck
        run: govulncheck ./...
  go-estate-security:
    name: go (estate) — gosec · staticcheck · govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantlekeep-estate
    # Scanned SEPARATELY from the core, which is the point of splitting the modules: a finding
    # here reds this job without touching the core's gate or its build. The estate carries no
    # third-party dependencies at all, so anything this reports is the module's own code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build pinned analysis tools
        env:
          # The tools module is intentionally OUTSIDE go.work: it exists to build
          # binaries and must never join the workspace the published modules share.
          GOWORK: "off"
        run: |
          go -C "$GITHUB_WORKSPACE/tools" build -o "$GITHUB_WORKSPACE/bin/" \
            honnef.co/go/tools/cmd/staticcheck \
            golang.org/x/vuln/cmd/govulncheck \
            github.com/securego/gosec/v2/cmd/gosec
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: gosec
        run: gosec ./...
      - name: staticcheck
        run: staticcheck ./...
      - name: govulncheck
        run: govulncheck ./...

  rust-security:
    name: rust — clippy · cargo-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mantlekeep
    # Rust carries its own gate because CodeQL cannot cover it: GitHub's default setup rejects
    # `rust` outright (actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python,
    # ruby, swift only). Without this job the Rust tree — which is where the sovereign kernel
    # lands — would be the one component with no static analysis at all, while the Security tab
    # still read as green. A gate nothing runs is worse than no gate, because it is believed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup ships on the runner image, so pinning the toolchain here adds no third-party
      # action to the supply chain — the same reason the Go job installs its tools with `go
      # install` rather than a marketplace action.
      - name: toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --component clippy
          rustup default "${RUST_VERSION}"
      # clippy — lint and unsafe-pattern analysis. `-D warnings` is the gate: any lint fails the
      # job, matching gosec's exit-non-zero-on-any-finding on the Go side. --all-targets covers
      # tests and benches, where unsafe code is as real as it is in src/.
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      # cargo-audit — fails on any advisory affecting the LOCKED dependency graph: vulnerabilities
      # (the default), plus unsound APIs and yanked crates, which are defects with a known fix.
      # Deliberately NOT `--deny warnings`, which also reds the gate on UNMAINTAINED crates —
      # those have no fix to apply, so they would block every branch on an upstream that may
      # never move, and a gate a team cannot keep green is a gate it learns to bypass.
      - name: cargo-audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny unsound --deny yanked
