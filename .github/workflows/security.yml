name: security

# The permanent security gate. Every push and PR to main is scanned in BOTH languages before it
# can land: the Java surface with SpotBugs + FindSecBugs (security detectors), the Go engine with
# gosec, staticcheck, and govulncheck. Any finding — or any known CVE — fails the job. This runs
# alongside ci.yml (the build/test gate); keeping security in its own workflow makes a red gate
# read as "unsafe to adopt", not "the build broke".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly re-scan on UNCHANGED code: a stdlib/dependency CVE disclosed after the last commit only
  # surfaces on a push otherwise. This makes "keep the framework CVE-clean" self-maintaining — a new
  # advisory reds this gate within the week, prompting a toolchain/dep bump even with no code change.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

env:
  # java-core binds the Rust ABI via java.lang.foreign (release 22) and the spring-boot family
  # targets a Java 25 toolchain — 25 satisfies both and is auto-detected for the toolchain.
  JAVA_VERSION: "25"
  # Pinned to the exact patched toolchain, not a floating "1.26.x": go1.26.6 clears the crypto/tls,
  # net/http and encoding/asn1 stdlib advisories (GO-2026-6090/6089/5972/5856) that govulncheck flags
  # on 1.26.4. Bump this in lockstep with mantlekeep-control/go.mod's `go` directive on the next CVE.
  GO_VERSION: "1.26.6"

jobs:
  java-security:
    name: java — spotbugs + findsecbugs (sdk + spring-boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # spotbugsMain fails the build on any SpotBugs/FindSecBugs finding that the justified
      # exclude filter (spotbugs-exclude.xml) does not cover — that is the gate.
      - name: sdk — spotbugs + findsecbugs
        run: ./gradlew spotbugsMain --no-daemon
        working-directory: sdks/java
      - name: spring-boot — spotbugs + findsecbugs
        run: ./gradlew spotbugsMain --no-daemon
        working-directory: mantlekeep-spring-boot

  go-security:
    name: go — gosec · staticcheck · govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantlekeep-control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # gosec — security-focused static analysis; exits non-zero on any finding.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" ./...
      # staticcheck — correctness/lint that also catches unsafe patterns.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
      # govulncheck — fails on any KNOWN CVE reachable from the code.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
