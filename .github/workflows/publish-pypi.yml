name: publish-pypi
# Publishes the MantleKeep Python SDK (sdks/python) to PyPI on a real release tag.
#
# Auth is TRUSTED PUBLISHING (OIDC) — NO API token, NO GPG. GitHub Actions proves its identity to
# PyPI directly via the id-token, so there is no secret to store or leak. PyPI removed GPG signature
# support in 2023; this is the modern path.
#
# ONE-TIME SETUP (on pypi.org, done by the owner before the first tag):
#   PyPI → your account → Publishing → "Add a pending publisher" for a project that does not exist yet:
#     PyPI Project Name: mantlekeep
#     Owner:             mantlekeep
#     Repository name:   mantlekeep
#     Workflow name:     publish-pypi.yml
#     Environment name:  pypi
#   The first successful run then CREATES the project and claims the name.
#
# Immutable, like Maven Central: a released version can never be replaced — so this fires only on a
# plain vX.Y.Z tag (no -rc / -SNAPSHOT), matching the Maven release trigger.
#
# Org policy: every action pinned to a full commit SHA.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: read
jobs:
  pypi:
    name: build + publish the Python SDK to PyPI (Trusted Publishing)
    if: '!contains(github.ref_name, ''-rc'') && !contains(github.ref_name, ''-SNAPSHOT'')'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # REQUIRED for Trusted Publishing (OIDC) — this is the only credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build sdist + wheel
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: publish to PyPI (Trusted Publishing — no token)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: sdks/python/dist
