name: publish-pypi
# Publishes the MantleKeep Python SDK (sdks/python) to PyPI.
#
# Auth: PyPI API TOKEN (secret PYPI_API_TOKEN). Trusted Publishing (OIDC) was tried first but the
# publisher claims never matched; a token has no claim-matching and just works. (You can migrate back
# to Trusted Publishing later — it is the more secure ideal — once the publisher config is confirmed.)
#
# ONE-TIME SETUP (owner):
#   PyPI → Account settings → API tokens → "Add API token"
#     Token name:  mantlekeep-publish
#     Scope:       "Entire account"   ← REQUIRED for the FIRST publish (the project does not exist yet;
#                                        project-scoped tokens can only be made for existing projects).
#                                        After the first publish creates `mantlekeep`, narrow it to that project.
#   Copy the token (starts `pypi-…`) → repo Settings → Secrets and variables → Actions →
#     New repository secret:  name PYPI_API_TOKEN,  value = the token.
#
# Immutable, like Maven Central: a released version can never be replaced — so the tag path fires only
# on a plain vX.Y.Z tag. workflow_dispatch lets the owner publish the current main without re-tagging.
#
# Org policy: every action pinned to a full commit SHA.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pypi:
    name: build + publish the Python SDK to PyPI
    if: '!contains(github.ref_name, ''-rc'') && !contains(github.ref_name, ''-SNAPSHOT'')'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: build sdist + wheel
        working-directory: sdks/python
        run: |
          python -m pip install build==1.2.2
          python -m build
      - name: publish to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: sdks/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
