name: ci

# The publish gate for a framework whose promise is "safe to adopt": the Go engine is vetted,
# statically analysed, and scanned for known vulnerabilities; its near-zero-dependency claim is
# enforced, not asserted; and both Java build systems (Gradle and Maven) are exercised so a host
# that must build from source can.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned to go1.26.6 — the patched toolchain that clears the crypto/tls, net/http and
  # encoding/asn1 stdlib advisories (GO-2026-6090/6089/5972/5856) govulncheck flags on 1.26.4.
  # Kept in lockstep with mantlekeep-control/go.mod's `go` directive; bump both on the next CVE.
  GO_VERSION: "1.26.6"

jobs:
  go:
    name: go — vet · staticcheck · govulncheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantlekeep-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build pinned analysis tools
        env:
          # The tools module is intentionally OUTSIDE go.work: it exists to build
          # binaries and must never join the workspace the published modules share.
          GOWORK: "off"
        run: |
          go -C "$GITHUB_WORKSPACE/tools" build -o "$GITHUB_WORKSPACE/bin/" \
            honnef.co/go/tools/cmd/staticcheck \
            golang.org/x/vuln/cmd/govulncheck \
            github.com/securego/gosec/v2/cmd/gosec
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: staticcheck ./...
      - name: govulncheck
        run: govulncheck ./...
      - name: go test
        run: go test ./...

  go-kafka:
    name: go (kafka adapter) — vet · staticcheck · govulncheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantlekeep-kafka
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build pinned analysis tools
        env:
          # The tools module is intentionally OUTSIDE go.work: it exists to build
          # binaries and must never join the workspace the published modules share.
          GOWORK: "off"
        run: |
          go -C "$GITHUB_WORKSPACE/tools" build -o "$GITHUB_WORKSPACE/bin/" \
            honnef.co/go/tools/cmd/staticcheck \
            golang.org/x/vuln/cmd/govulncheck \
            github.com/securego/gosec/v2/cmd/gosec
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: staticcheck ./...
      - name: govulncheck
        run: govulncheck ./...
      # No broker is started, and none is needed: the cluster is behind an interface, so
      # every rule in the adapter is decided without one.
      - name: go test
        run: go test ./...

  go-policy-postgres:
    name: go (policy postgres) — vet · staticcheck · govulncheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantlekeep-policy-postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build pinned analysis tools
        env:
          # The tools module is intentionally OUTSIDE go.work: it exists to build
          # binaries and must never join the workspace the published modules share.
          GOWORK: "off"
        run: |
          go -C "$GITHUB_WORKSPACE/tools" build -o "$GITHUB_WORKSPACE/bin/" \
            honnef.co/go/tools/cmd/staticcheck \
            golang.org/x/vuln/cmd/govulncheck \
            github.com/securego/gosec/v2/cmd/gosec
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: staticcheck ./...
      - name: govulncheck
        run: govulncheck ./...
      # No database is started, and none is needed here: Postgres is behind the Store
      # interface, so every RULE in the adapter is decided without one. The SQL that makes
      # those rules true is proved separately, against a real server, by the tests that run
      # when MANTLEKEEP_POSTGRES_TEST_DSN names a throwaway database — see the module README.
      # They skip when it is unset, which is what keeps this job honest rather than merely
      # green: it claims only what it actually checked.
      - name: go test
        run: go test ./...

  go-estate:
    name: go (estate) — vet · staticcheck · govulncheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantlekeep-estate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build pinned analysis tools
        env:
          # The tools module is intentionally OUTSIDE go.work: it exists to build
          # binaries and must never join the workspace the published modules share.
          GOWORK: "off"
        run: |
          go -C "$GITHUB_WORKSPACE/tools" build -o "$GITHUB_WORKSPACE/bin/" \
            honnef.co/go/tools/cmd/staticcheck \
            golang.org/x/vuln/cmd/govulncheck \
            github.com/securego/gosec/v2/cmd/gosec
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: staticcheck ./...
      - name: govulncheck
        run: govulncheck ./...
      # No cluster is started, and none is needed: every backend is behind the Port
      # interface, so every rule in the engine is decided without one.
      - name: go test
        run: go test ./...

  go-dep-guard:
    name: go — near-zero-dependency guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # The core's budget is 1 (bbolt) and must stay there. This is the check that proves
      # an adapter's client library did not creep into the engine.
      - name: dependency count guard — core
        run: bash scripts/check-deps.sh mantlekeep-control
      # The Kafka adapter's own budget: the core, plus the three franz-go modules (kadm,
      # kerr via franz-go, kmsg). Raise it in a commit that says why.
      - name: dependency count guard — kafka adapter
        run: MANTLEKEEP_DEP_BASELINE=4 bash scripts/check-deps.sh mantlekeep-kafka
      # The policy store's own budget: the core, plus the Postgres driver. Two, and it stays
      # there — the whole point of the split is that this driver cannot reach the engine.
      - name: dependency count guard — policy postgres adapter
        run: MANTLEKEEP_DEP_BASELINE=2 bash scripts/check-deps.sh mantlekeep-policy-postgres

  java-gradle:
    name: java — gradle build (sdk + spring-boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "25"
      - name: sdk (gradle)
        run: ./gradlew build --no-daemon
        working-directory: sdks/java
      - name: spring-boot (gradle)
        run: ./gradlew build --no-daemon
        working-directory: mantlekeep-spring-boot

  java-maven:
    name: java — maven build (sdk BOM before spring-boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "25"
      # The SDK must install to the local repo BEFORE the spring-boot family builds — the
      # starter family depends on the SDK's published coordinates via the BOM.
      - name: sdk install (maven)
        run: mvn -B install
        working-directory: sdks/java
      - name: spring-boot (maven)
        run: mvn -B install
        working-directory: mantlekeep-spring-boot

  python:
    name: python — sdk tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The integration test builds and runs the Go door, so the Go toolchain is set up above;
      # the SDK itself has no runtime dependencies to install.
      - name: python sdk tests
        run: python3 -m unittest discover -s tests -t .
        working-directory: sdks/python
