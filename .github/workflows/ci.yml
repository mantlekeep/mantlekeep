name: ci

# The publish gate for a framework whose promise is "safe to adopt": the Go engine is vetted,
# statically analysed, and scanned for known vulnerabilities; its near-zero-dependency claim is
# enforced, not asserted; and both Java build systems (Gradle and Maven) are exercised so a host
# that must build from source can.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # 1.26.5+ clears two stdlib-only advisories present in 1.26.4 (crypto/tls, os) while honouring
  # the module's `go 1.26.4` directive. No project dependency is affected by them.
  GO_VERSION: "1.26.x"

jobs:
  go:
    name: go — vet · staticcheck · govulncheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mantlekeep-control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: go test
        run: go test ./...

  go-dep-guard:
    name: go — near-zero-dependency guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: dependency count guard
        run: bash scripts/check-deps.sh mantlekeep-control

  java-gradle:
    name: java — gradle build (sdk + spring-boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "25"
      - name: sdk (gradle)
        run: ./gradlew build --no-daemon
        working-directory: sdks/java
      - name: spring-boot (gradle)
        run: ./gradlew build --no-daemon
        working-directory: mantlekeep-spring-boot

  java-maven:
    name: java — maven build (sdk BOM before spring-boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "25"
      # The SDK must install to the local repo BEFORE the spring-boot family builds — the
      # starter family depends on the SDK's published coordinates via the BOM.
      - name: sdk install (maven)
        run: ./mvnw -B install
        working-directory: sdks/java
      - name: spring-boot (maven)
        run: ./mvnw -B install
        working-directory: mantlekeep-spring-boot

  python:
    name: python — sdk tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The integration test builds and runs the Go door, so the Go toolchain is set up above;
      # the SDK itself has no runtime dependencies to install.
      - name: python sdk tests
        run: python3 -m unittest discover -s tests -t .
        working-directory: sdks/python
