name: publish-central

# Publishes the MantleKeep Java SDK to Maven Central (the Sonatype Central Portal).
#
# Central is IMMUTABLE per coordinate — a released GAV can NEVER be replaced — so this
# workflow never publishes a pre-release. Two paths:
#   * release  — a plain `vX.Y.Z` tag (no -rc / no -SNAPSHOT) uploads a signed bundle to
#                the Central Portal. autoPublish=false: a human clicks "Publish" after review.
#   * snapshot — manual dispatch only; deploys a `-SNAPSHOT` to the Central snapshot repo
#                (mutable) for pre-release testing without burning an immutable coordinate.
#
# Required repo secrets (add under Settings → Secrets and variables → Actions):
#   CENTRAL_USERNAME   — Central Portal user token name
#   CENTRAL_PASSWORD   — Central Portal user token secret
#   GPG_PRIVATE_KEY    — ASCII-armored private signing key (exported with --armor)
#   GPG_PASSPHRASE     — passphrase for that key
#
# Org policy: every action is pinned to a full commit SHA (a @vN tag fails at job setup).

on:
  push:
    # Real releases only: vMAJOR.MINOR.PATCH with NO pre-release suffix. The job below
    # additionally rejects anything containing -rc/-SNAPSHOT as a defense in depth.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- release: signed upload to the Central Portal on a plain vX.Y.Z tag -------------
  release:
    name: release — sign + upload to Central Portal
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-SNAPSHOT')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # SDK tree first: `deploy` also installs to ~/.m2, so the spring-boot tree below resolves
      # mantlekeep-door-client (dev.mantlekeep) locally.
      - name: deploy SDK to Central Portal (autoPublish=false — human publishes)
        working-directory: sdks/java
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P release -DskipTests deploy
      # Spring-boot starters (mantlekeep-spring-boot-*): products + the Frame facade depend on
      # starter-webflux from THIS tree, so it must publish to Central too, not just the SDK.
      - name: deploy spring-boot starters to Central Portal
        working-directory: mantlekeep-spring-boot
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P release -DskipTests deploy

  # ---- snapshot: manual dispatch → mutable Central snapshot repo -----------------------
  snapshot:
    name: snapshot — deploy -SNAPSHOT to Central snapshot repo
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: set -SNAPSHOT version (BOTH trees, in lockstep)
        # Derive the base version from the SDK POM and force a -SNAPSHOT coordinate (mutable) on
        # BOTH reactors, so pre-release testing never consumes an immutable release GAV and the
        # spring-boot tree's ${project.version} pin of the SDK resolves the same -SNAPSHOT.
        run: |
          BASE_VERSION=$(cd sdks/java && mvn -B -q -N -Dexpression=project.version -DforceStdout help:evaluate | sed -E 's/-(rc\.[0-9]+|SNAPSHOT)$//')
          echo "base=$BASE_VERSION → ${BASE_VERSION}-SNAPSHOT"
          (cd sdks/java && mvn -B versions:set -DnewVersion="${BASE_VERSION}-SNAPSHOT" -DgenerateBackupPoms=false)
          (cd mantlekeep-spring-boot && mvn -B versions:set -DnewVersion="${BASE_VERSION}-SNAPSHOT" -DgenerateBackupPoms=false)
      - name: deploy SDK snapshot to Central
        working-directory: sdks/java
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P release -DskipTests deploy
      - name: deploy spring-boot snapshot to Central
        working-directory: mantlekeep-spring-boot
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P release -DskipTests deploy
