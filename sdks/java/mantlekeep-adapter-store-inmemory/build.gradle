// mantlekeep-adapter-store-inmemory — an EXAMPLE adapter SDK: a StorePort adapter packaged
// as its own jar, proving any team can extend the SDK without touching the core.
// Compile-time dependency is the SPI ONLY (one-way: adapter → spi, never the core).
// The door-client appears in TEST scope only — the tests drive the real AdapterCatalog
// selection path; nothing of it leaks into this adapter's published ABI.
plugins { id 'java-library' }

compileJava.options.release = 17
compileTestJava.options.release = 17

dependencies {
    implementation project(':mantlekeep-adapter-spi')

    testImplementation project(':mantlekeep-door-client')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

tasks.named('test') { useJUnitPlatform() }
