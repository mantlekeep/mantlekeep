// Root module — the ORIGINAL flat sidecar client (dev.mantlekeep.MantlekeepClient), kept
// compiling untouched while the multi-module SDK grows in the subprojects below.
// New work goes in mantlekeep-adapter-spi / mantlekeep-door-client / mantlekeep-spring-boot-starter /
// mantlekeep-java-core; this flat client remains for the sidecar demo path.
plugins { id 'java-library' }

// MantleKeep's Java SDK uses ONLY the JDK (java.net.http) — no external dependencies,
// so it drags nothing into a host's app. Compiled for JDK 17+ bytecode with whatever
// newer JDK runs the build (release, not toolchain — no JDK auto-download needed).
compileJava.options.release = 17

// Run the example against a live core:  ./gradlew run   (needs `mantlekeep serve` on :8080)
tasks.register('run', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.mantlekeep.Example'
}
