// Root module — the ORIGINAL flat sidecar client (dev.mantlekeep.MantlekeepClient), kept
// compiling untouched while the multi-module SDK grows in the subprojects below.
// New work goes in mantlekeep-adapter-spi / mantlekeep-door-client / mantlekeep-spring-boot-starter /
// mantlekeep-java-core; this flat client remains for the sidecar demo path.
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.Confidence

plugins {
    id 'java-library'
    // SpotBugs static analysis + FindSecBugs security detectors. BUILD-only: drags nothing
    // into the published jars. Applied to every java-library module in allprojects below.
    id 'com.github.spotbugs' version '6.5.11' apply false
}

// MantleKeep's Java SDK uses ONLY the JDK (java.net.http) — no external dependencies,
// so it drags nothing into a host's app. Compiled for JDK 17+ bytecode with whatever
// newer JDK runs the build (release, not toolchain — no JDK auto-download needed).
compileJava.options.release = 17

tasks.register('resolveAndLockAll') {
    description = 'Resolves every lockable configuration so --write-locks can record it.'
    doFirst {
        if (!gradle.startParameter.writeDependencyLocks) {
            throw new GradleException('run this with --write-locks, or it records nothing')
        }
    }
    doLast {
        configurations.findAll { it.canBeResolved }*.resolve()
    }
}


// Run the example against a live core:  ./gradlew run   (needs `mantlekeep serve` on :8080)
tasks.register('run', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.mantlekeep.Example'
}

// ── Publishing (Maven) ───────────────────────────────────────────────────────
// Coordinates: dev.mantlekeep:<module>:<version> (artifactId = module name). The brand
// group is kept even on GitHub Packages — which verifies no namespace — so the SAME GAV
// upgrades to Maven Central later, once mantlekeep.dev is owned + DNS-verified. An internal
// artifact proxy mirrors GitHub Packages exactly as it would Central. Consume with:
//   implementation "dev.mantlekeep:mantlekeep-spring-boot-starter:0.1.0"
allprojects {
    // Dependency locking. The published jars carry no external dependencies at all, so this
    // locks the BUILD: the test and static-analysis classpaths. Without a lock file those
    // resolve fresh on every run, which means the analysis that gates a release is not the
    // same analysis twice — the same argument that pins the Go toolchain in tools/go.mod.
    //
    // Regenerate after changing a dependency:  ./gradlew resolveAndLockAll --write-locks
    dependencyLocking {
        lockAllConfigurations()
    }

    group = 'dev.mantlekeep'
    version = '0.1.1'

    // SpotBugs + FindSecBugs on every java-library module. effort=max, reportLevel=low so the
    // security scan sees everything; HTML (human) + XML (CI/machine) reports. The build FAILS
    // on any remaining finding (spotbugs default) — false positives are justified out in
    // spotbugs-exclude.xml, never blanket-suppressed.
    plugins.withId('java-library') {
        apply plugin: 'com.github.spotbugs'
        spotbugs {
            // valueOf, not Effort.MAX / Confidence.LOW: these Kotlin enums generate per-constant
            // synthetic classes (Confidence$LOW …) that shadow the static field under Groovy.
            effort = Effort.valueOf('MAX')
            reportLevel = Confidence.valueOf('LOW')
            excludeFilter = rootProject.file('spotbugs-exclude.xml')
        }
        dependencies {
            spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
        }
        tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
            reports {
                html { required = true }
                xml { required = true }
            }
        }
        // The security gate scans PRODUCTION (main) sources — the shipped surface. Test sources are
        // not published and are out of scope; leaving spotbugsTest wired into `check` would make the
        // unrelated `gradle build` break on test-only patterns. spotbugsMain remains the gate.
        tasks.matching { it.name == 'spotbugsTest' }.configureEach { enabled = false }
    }

    // Every java-library module (root flat client + the SDK subprojects) becomes publishable.
    // Sources jar included (cheap + useful); javadoc jar is deferred to the Maven Central step
    // (Central requires it, GitHub Packages does not — keeps this build robust for now).
    plugins.withId('java-library') {
        apply plugin: 'maven-publish'
        java { withSourcesJar() }
        publishing {
            publications {
                maven(MavenPublication) { from components.java }
            }
            repositories {
                maven {
                    name = 'GitHubPackages'
                    url = uri('https://maven.pkg.github.com/mantlekeep/mantlekeep')
                    credentials {
                        // set at publish time via env (GITHUB_ACTOR/GITHUB_TOKEN) or
                        // gradle.properties (gpr.user/gpr.key); lazy — local publish needs neither.
                        username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
                        password = System.getenv('GITHUB_TOKEN') ?: findProperty('gpr.key')
                    }
                }
            }
        }
    }
}
