# SonarQube configuration for open-source scanning of MantleKeep.
# Run: sonar-scanner  (against a SonarQube server or SonarCloud)

sonar.projectKey=mantlekeep
sonar.projectName=MantleKeep

# Sources: the Go engine and the language SDKs. Demos, experiments and build output are not
# the release surface and would only add noise / false positives.
sonar.sources=mantlekeep-control,mantlekeep-estate,mantlekeep-kafka,sdks,mantlekeep-spring-boot
sonar.exclusions=**/build/**,**/target/**,**/*_test.go,**/testdata/**,**/examples/**,**/spike/**

# Tests, declared separately so coverage attributes correctly.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/src/test/**,**/tests/**

sonar.go.exclusions=**/vendor/**
sonar.sourceEncoding=UTF-8

# One scoped exception, with its reason.
#
# S8566 wants a go.sum beside every go.mod. mantlekeep-estate has none because it CAN have
# none: its only requirement is the core in this repository, resolved through a `replace` to
# a sibling directory, and a filesystem replace has no checksum to record. The module has
# zero third-party dependencies, so there is nothing a lock file could pin.
#
# This is TEMPORARY. When the estate requires a published core version instead of the local
# replace, `go mod tidy` produces a real go.sum and this block must be deleted — and if a
# third-party dependency is ever added before then, delete it immediately, because from that
# moment the finding is real.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=text:S8566
sonar.issue.ignore.multicriteria.e1.resourceKey=mantlekeep-estate/go.mod
